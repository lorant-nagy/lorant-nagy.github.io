<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg:      #0d0f14;
    --surface: #13161d;
    --border:  rgba(255,255,255,0.07);
    --text:    #c8cdd8;
    --muted:   #565c6e;
    --state:   #7F77DD;
    --xin:     #e8824a;
    --rgate:   #378ADD;
    --zgate:   #1D9E75;
    --cand:    #aa701e;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    padding: 1.1rem 1.4rem 0.9rem;
    gap: 0.55rem;
    overflow: hidden;
  }

  a.back {
    position: fixed; top:1rem; left:1.25rem;
    font-size:11px; color:var(--muted);
    text-decoration:none; letter-spacing:0.05em; z-index:10;
  }
  a.back:hover { color:var(--text); }

  h1 {
    font-family:'Spectral',serif; font-weight:300;
    font-size:1.45rem; color:#e8e4dc; letter-spacing:0.02em;
    padding-top: 1.4rem;
  }

  .meta { font-size:12px; color:var(--muted); line-height:1.85; font-style:italic; }
  .meta .name { font-style:normal; color:var(--text); }
  .meta .cite { font-style:normal; }

  .page { display:flex; flex-direction:column; min-height:0; }

  .card-title {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 0.28rem;
    margin-bottom: 0.5rem;
    flex-shrink: 0;
  }

  #gru-svg { width:100%; flex:1; display:block; min-height:0; }

  .flow-dot {
    offset-rotate: 0deg;
    animation-duration: 8.5s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-fill-mode: both;
  }

  @media (max-width: 600px) {
    body {
      height: auto; overflow: auto;
      padding: 2.5rem 1rem 2rem;
      grid-template-rows: auto auto auto;
    }
    #gru-svg { flex: none; min-height: 300px; }
  }
</style>
</head>
<body>

<a class="back" href="/networks/">← networks</a>

<h1>GRU</h1>

<div class="meta">
  <span class="name">Gated Recurrent Unit</span><br>
  <span class="cite">Cho, van Merriënboer, Gulcehre, Bahdanau, Bougares, Schwenk &amp; Bengio — Learning Phrase Representations using RNN Encoder–Decoder for Statistical Machine Translation, EMNLP 2014</span>
</div>

<div class="page">

  <div class="card-title">computation graph</div>

  <svg id="gru-svg" viewBox="0 -10 700 320" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="rgba(255,255,255,0.3)"/>
      </marker>
      <marker id="ar-dim" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 z" fill="rgba(255,255,255,0.16)"/>
      </marker>
    </defs>

    <g id="edges" fill="none">
      <path id="e-h-o1"  d="M 58,60 L 383,60"                              stroke="rgba(127,119,221,0.5)"  stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-h-r"   d="M 44,78 C 44,120 80,150 118,166"               stroke="rgba(255,255,255,0.28)" stroke-width="1"   marker-end="url(#ar)"/>
      <path id="e-x-r"   d="M 48,235 C 60,210 85,192 118,182"              stroke="rgba(255,255,255,0.28)" stroke-width="1"   marker-end="url(#ar)"/>
      <path id="e-h-z"   d="M 55,72 C 130,120 190,148 248,167"             stroke="rgba(255,255,255,0.28)" stroke-width="1"   marker-end="url(#ar)"/>
      <path id="e-x-z"   d="M 52,240 C 130,250 210,215 248,190"            stroke="rgba(255,255,255,0.28)" stroke-width="1"   marker-end="url(#ar)"/>
      <path id="e-r-orh" d="M 158,152 L 158,117"                           stroke="#378ADD"                stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-h-orh" d="M 57,55 C 100,50 132,68 149,86"                stroke="rgba(127,119,221,0.5)"  stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-orh-t" d="M 172,108 C 260,124 340,142 388,166"           stroke="#378ADD"                stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-x-t"   d="M 57,255 C 200,288 320,242 392,197"            stroke="rgba(232,130,74,0.45)"  stroke-width="1"   marker-end="url(#ar)"/>
      <path id="e-z-o1"  d="M 326,163 C 352,140 370,95 388,66"             stroke="#1D9E75"                stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-z-o2"  d="M 320,190 C 420,270 520,250 534,135"           stroke="#1D9E75"                stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-t-o2"  d="M 478,180 C 505,168 522,148 528,132"           stroke="#aa701e"                stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-o1-p"  d="M 415,60 L 575,60"                             stroke="rgba(127,119,221,0.5)"  stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-o2-p"  d="M 546,106 C 570,92 583,78 588,74"              stroke="rgba(127,119,221,0.5)"  stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-p-h"   d="M 607,60 L 635,60"                             stroke="rgba(127,119,221,0.5)"  stroke-width="1.2" marker-end="url(#ar)"/>
      <path id="e-loop"  d="M 655,42 C 655,2 300,-4 46,42"                 stroke="rgba(255,255,255,0.16)" stroke-width="1"   stroke-dasharray="3,4" marker-end="url(#ar-dim)"/>
    </g>

    <g id="nodes" font-family="'JetBrains Mono',monospace">
      <circle cx="40" cy="60" r="18" fill="#1e2230" stroke="#7F77DD" stroke-width="1.2"/>
      <text x="40" y="60" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#7F77DD">h<tspan font-size="8" dy="2">t−1</tspan></text>

      <circle cx="40" cy="250" r="18" fill="#1e2230" stroke="#e8824a" stroke-width="1.2"/>
      <text x="40" y="250" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#e8824a">x<tspan font-size="8" dy="2">t</tspan></text>

      <rect x="120" y="152" width="76" height="46" rx="4" fill="none" stroke="#378ADD" stroke-width="1.1"/>
      <text x="158" y="175" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#378ADD">σ</text>
      <text x="158" y="144" text-anchor="middle" font-size="11" fill="#378ADD">r<tspan font-size="8" dy="2">t</tspan></text>

      <rect x="250" y="152" width="76" height="46" rx="4" fill="none" stroke="#1D9E75" stroke-width="1.1"/>
      <text x="288" y="175" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#1D9E75">σ</text>
      <text x="288" y="144" text-anchor="middle" font-size="11" fill="#1D9E75">z<tspan font-size="8" dy="2">t</tspan></text>

      <rect x="390" y="152" width="88" height="46" rx="4" fill="none" stroke="#aa701e" stroke-width="1.1"/>
      <text x="434" y="175" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#aa701e">tanh</text>
      <text x="434" y="144" text-anchor="middle" font-size="11" fill="#aa701e">h̃<tspan font-size="8" dy="2">t</tspan></text>

      <circle cx="158" cy="100" r="15" fill="#1e2230" stroke="rgba(255,255,255,0.28)"/>
      <text x="158" y="100" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--text)">⊙</text>

      <circle cx="400" cy="60" r="15" fill="#1e2230" stroke="rgba(255,255,255,0.28)"/>
      <text x="400" y="60" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--text)">⊙</text>

      <circle cx="534" cy="118" r="15" fill="#1e2230" stroke="rgba(255,255,255,0.28)"/>
      <text x="534" y="118" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--text)">⊙</text>

      <circle cx="592" cy="60" r="15" fill="#1e2230" stroke="rgba(255,255,255,0.28)"/>
      <text x="592" y="60" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="var(--text)">+</text>

      <circle cx="655" cy="60" r="18" fill="#1e2230" stroke="#7F77DD" stroke-width="1.2"/>
      <text x="655" y="60" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#7F77DD">h<tspan font-size="8" dy="2">t</tspan></text>

      <text x="356" y="104" text-anchor="middle" font-size="10" fill="#1D9E75">1−z<tspan font-size="7" dy="2">t</tspan></text>
    </g>

    <g id="dots"></g>
  </svg>

</div>

<script>
(function () {
  'use strict';

  var SPEED = 16, MIN_W = 4, MAX_W = 18, FADE = 1.2;

  var EDGES = [
    { id:'e-h-r',   grp:1, dot:'#7F77DD' },
    { id:'e-x-r',   grp:1, dot:'#e8824a' },
    { id:'e-h-z',   grp:1, dot:'#7F77DD' },
    { id:'e-x-z',   grp:1, dot:'#e8824a' },
    { id:'e-r-orh', grp:2, dot:'#378ADD' },
    { id:'e-h-orh', grp:2, dot:'#7F77DD', early:true },
    { id:'e-orh-t', grp:3, dot:'#378ADD' },
    { id:'e-x-t',   grp:3, dot:'#e8824a', early:true },
    { id:'e-z-o1',  grp:4, dot:'#1D9E75' },
    { id:'e-h-o1',  grp:4, dot:'#7F77DD', early:true },
    { id:'e-z-o2',  grp:4, dot:'#1D9E75' },
    { id:'e-t-o2',  grp:4, dot:'#aa701e' },
    { id:'e-o1-p',  grp:5, dot:'#7F77DD' },
    { id:'e-o2-p',  grp:5, dot:'#7F77DD' },
    { id:'e-p-h',   grp:6, dot:'#7F77DD' },
    { id:'e-loop',  grp:7, dot:'#7F77DD' }
  ];

  var GROUP_END  = { 1:16, 2:30, 3:46, 4:64, 5:78, 6:84, 7:100 };
  var GROUP_CAPW = { 7:15 };

  var svg = document.getElementById('gru-svg');
  var dotLayer = document.getElementById('dots');
  var kf = document.createElement('style');
  document.head.appendChild(kf);
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function build() {
    var live = [];
    EDGES.forEach(function (e) {
      var el = document.getElementById(e.id);
      if (!el) return;
      live.push({ cfg: e, d: el.getAttribute('d'), len: el.getTotalLength() });
    });

    var byGroup = {};
    live.forEach(function (o) {
      var g = o.cfg.grp;
      (byGroup[g] = byGroup[g] || []).push(o);
    });

    var rules = [];
    Object.keys(byGroup).forEach(function (g) {
      var items = byGroup[g];
      var end = GROUP_END[g];
      var paced = items.filter(function (o) { return !o.cfg.early; });
      if (!paced.length) paced = items;
      var maxLen = paced.reduce(function (m, o) { return Math.max(m, o.len); }, 1);

      var w = maxLen / SPEED;
      if (w < MIN_W) w = MIN_W;
      if (w > MAX_W) w = MAX_W;
      if (GROUP_CAPW[g] && w > GROUP_CAPW[g]) w = GROUP_CAPW[g];
      if (w > end) w = end;

      items.forEach(function (o, i) {
        var start = o.cfg.early ? 0 : end - w * (o.len / maxLen);
        if (start < 0) start = 0;
        var name = 'gru-flow-' + g + '-' + i;
        var fadeIn = Math.min(start + FADE, end - 0.5);
        var hold   = Math.max(end - 1, fadeIn);

        rules.push(
          '@keyframes ' + name + '{' +
          '0%,' + start.toFixed(2) + '%{offset-distance:0%;opacity:0}' +
          fadeIn.toFixed(2) + '%{opacity:1}' +
          hold.toFixed(2) + '%{opacity:1}' +
          end.toFixed(2) + '%,100%{offset-distance:100%;opacity:0}}'
        );

        var dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('class', 'flow-dot');
        dot.setAttribute('r', 4.5);
        dot.setAttribute('fill', o.cfg.dot);
        dot.style.offsetPath = "path('" + o.d + "')";
        dot.style.animationName = name;
        dotLayer.appendChild(dot);
      });
    });

    kf.textContent = rules.join('\n');
  }

  build();
})();
</script>

</body>
</html>
