<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedforward network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg:      #0d0f14;
    --surface: #13161d;
    --border:  rgba(255,255,255,0.07);
    --text:    #c8cdd8;
    --muted:   #565c6e;
    --neg:     #378ADD;
    --pos:     #e8824a;
    --accent:  #aa701e;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr;
    padding: 1.1rem 1.4rem 0.9rem;
    gap: 0.55rem;
    overflow: hidden;
  }

  .back-link {
    position: fixed; top: 1rem; left: 1.25rem;
    font-size: 11px; color: var(--muted);
    text-decoration: none; letter-spacing: 0.05em; z-index: 10;
  }
  .back-link:hover { color: var(--text); }

  h1 {
    font-family: 'Spectral', serif; font-weight: 300;
    font-size: 1.45rem; color: #e8e4dc; letter-spacing: 0.02em;
    padding-top: 1.4rem;
  }

  .equations {
    font-size: 12px; color: var(--muted);
    line-height: 1.85; font-style: italic;
  }
  .equations span { font-style: normal; }

  /* ── Main: 2×2 grid ── */
  .page {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 1fr auto;
    gap: 0.7rem;
    min-height: 0;
  }

  .canvas-card {
    grid-column: 1; grid-row: 1;
    padding: 0.8rem 1rem 0.65rem;
    display: flex; flex-direction: column;
    min-height: 0;
  }

  .controls-card {
    grid-column: 2; grid-row: 1 / span 2;   /* full right column height */
    padding: 0.95rem 0.85rem 0.75rem;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }

  .narrative-card {
    grid-column: 1; grid-row: 2;   /* only under network, controls don't overlap */
    padding: 0.7rem 1rem;
  }

  /* SVG: viewBox 560×300 — browser preserves aspect ratio automatically.
     flex:1 means it takes all leftover height; it will never distort. */
  #nn-svg {
    width: 100%; flex: 1; display: block; min-height: 0;
  }

  .legend {
    display: flex; gap: 0.9rem; justify-content: center;
    margin-top: 0.3rem; font-size: 9.5px; color: var(--muted);
    letter-spacing: 0.06em; flex-shrink: 0;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 18px; height: 2px; border-radius: 1px; }

  .output-display {
    text-align: center; margin-top: 0.2rem;
    font-size: 10px; color: var(--muted); flex-shrink: 0;
  }
  .output-val {
    font-size: 1.1rem; font-family: 'Spectral', serif;
    font-weight: 300; color: var(--pos); display: block; margin-top: 0.05rem;
  }

  .narrative-card { padding: 0.7rem 1rem; }

  .card-title {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); border-bottom: 0.5px solid var(--border);
    padding-bottom: 0.25rem; margin-bottom: 0.45rem;
  }

  .narrative { font-size: 10.5px; color: var(--text); line-height: 1.65; }
  .narrative .hi  { color: var(--pos); }
  .narrative .lo  { color: var(--neg); }
  .narrative .dim { color: var(--muted); }

  /* ── Controls ── */
  .controls-card {
    padding: 0.75rem 0.85rem;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }

  .ctrl-section-title {
    font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); border-bottom: 0.5px solid var(--border);
    padding-bottom: 0.2rem; margin-top: 0.5rem; margin-bottom: 0.22rem;
    flex-shrink: 0;
  }
  .ctrl-section-title:first-child { margin-top: 0; }

  .weights-section {
    margin-left: 8px;
  }

  .reset-section {
    margin-top: 0.35rem;
  }

  .ctrl-row { display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.1rem; }
  .ctrl-label { font-size: 8.5px; color: var(--muted); min-width: 44px; flex-shrink: 0; }

  input[type=range] {
    flex: 1; appearance: none; -webkit-appearance: none; height: 2px;
    background: rgba(255,255,255,0.1); border-radius: 2px;
    outline: none; cursor: pointer; min-width: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 9px;
    border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .ctrl-val { font-size: 8.5px; color: var(--text); min-width: 28px; text-align: right; }

  .preset-select {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0.5px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    padding: 4px 6px;
    outline: none;
  }

  .preset-note {
    margin-top: 0.3rem;
    font-size: 8.5px;
    color: var(--muted);
    line-height: 1.55;
  }
  .preset-note strong { color: var(--text); font-weight: 500; }
  .preset-note .task { color: var(--accent); }

  .preset-section {
    margin-bottom: 0.45rem;
  }

  .fine-btn, .zero-btn {
    background: none; border: 0.5px solid var(--border);
    border-radius: 3px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 8px;
    padding: 0; height: 16px; cursor: pointer; transition: all 0.15s;
    line-height: 1; flex-shrink: 0;
  }
  .fine-btn { width: 17px; }
  .zero-btn { width: 20px; letter-spacing: 0.03em; }
  .fine-btn:hover, .zero-btn:hover {
    border-color: rgba(255,255,255,0.25); color: var(--text);
  }

  .reset-btn {
    width: 100%; background: none; border: 0.5px solid var(--border);
    border-radius: 3px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
    padding: 4px 0; cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.06em; margin-bottom: 0.1rem;
  }
  .reset-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }

  .act-fn-row { display: flex; gap: 0.3rem; margin-bottom: 0.2rem; }
  .act-btn {
    flex: 1; background: none; border: 0.5px solid var(--border);
    border-radius: 3px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
    padding: 3px 0; cursor: pointer; transition: all 0.15s; letter-spacing: 0.04em;
  }
  .act-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(170,112,30,0.08); }
  .act-btn:hover:not(.active):not(:disabled) { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .act-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    body { height: auto; overflow: auto; padding: 2.5rem 1rem 2rem; grid-template-rows: auto auto auto; }
    .page { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .canvas-card  { grid-column: 1; grid-row: 1; }
    .narrative-card { grid-column: 1; grid-row: 2; }
    .controls-card { grid-column: 1; grid-row: 3; max-height: 60vh; }
    #nn-svg { min-height: 200px; flex: none; aspect-ratio: 560/300; }
  }

</style>
</head>
<body>

<a class="back-link" href="/networks/">← networks</a>

<h1>feedforward network</h1>

<div class="equations">
  input: <span style="color:#e8824a">x</span> ∈ ℝ² &nbsp;&nbsp;
  hidden: <span style="color:#e8824a">a</span> = σ(W · <span style="color:#e8824a">x</span> + b),  W ∈ ℝ<sup>3×2</sup>,  <span style="color:#e8824a">a</span> ∈ ℝ³ &nbsp;&nbsp;
  output: <span style="color:#378ADD">ŷ</span> = v<sup>⊤</sup> · <span style="color:#e8824a">a</span> + c ∈ ℝ
</div>

<div class="page">

    <div class="canvas-card card">
      <div class="card-title">network</div>
      <svg id="nn-svg"></svg>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:var(--neg)"></div>negative</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,0.15)"></div>zero</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--pos)"></div>positive</div>
      </div>
      <div class="output-display">output <span class="output-val" id="output-val">—</span></div>
    </div>

    <div class="controls-card card" id="controls"></div>

    <div class="narrative-card card">
      <div class="card-title">what is happening</div>
      <div class="narrative" id="narrative"></div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const LAYERS = [2, 3, 1];
let actFn = 'sigmoid';
const inputs = [0.5, 0.5];
const weights = [
  [[ 0.6, -0.4], [ 0.8,  0.5], [-0.3,  0.9]],
  [[ 0.7, -0.5, 0.6]],
];
const biases = [[0.1, -0.2, 0.1], [0.0]];
const activations = {
  sigmoid: x => 1 / (1 + Math.exp(-x)),
  tanh:    x => Math.tanh(x),
  relu:    x => Math.max(0, x),
  linear:  x => x,
};

let currentPreset = 'custom';
const PRESETS = {
  custom: {
    label: 'Custom',
    task: 'manual mode',
    explanation: 'Use the sliders to build your own mapping. The explanation below updates from the current weights and biases.'
  },
  sum: {
    label: 'Sum',
    task: 'y ≈ x1 + x2',
    explanation: 'Two hidden units pass x1 and x2 straight through, then the output adds them.',
    actFn: 'linear',
    inputs: [0.7, -0.2],
    weights: [
      [[1, 0], [0, 1], [0, 0]],
      [[1, 1, 0]],
    ],
    biases: [[0, 0, 0], [0]],
  },
  difference: {
    label: 'Difference',
    task: 'y ≈ x1 − x2',
    explanation: 'The hidden layer keeps the two inputs separate, and the output subtracts the second from the first.',
    actFn: 'linear',
    inputs: [0.7, 0.2],
    weights: [
      [[1, 0], [0, 1], [0, 0]],
      [[1, -1, 0]],
    ],
    biases: [[0, 0, 0], [0]],
  },
  max: {
    label: 'Max',
    task: 'y = max(x1, x2)',
    explanation: 'With ReLU, the network can compute max(x1, x2) exactly as relu(x1−x2) + relu(x2) − relu(−x2).',
    actFn: 'relu',
    inputs: [0.8, -0.2],
    weights: [
      [[1, -1], [0, 1], [0, -1]],
      [[1, 1, -1]],
    ],
    biases: [[0, 0, 0], [0]],
  },
};

function setVector(target, source) {
  target.length = 0;
  source.forEach(v => target.push(v));
}

function setMatrix(target, source) {
  target.length = 0;
  source.forEach(row => target.push(row.slice()));
}

function presetExplanationHtml() {
  const preset = PRESETS[currentPreset];
  return `<strong>${preset.label}</strong><br><span class="task">${preset.task}</span><br>${preset.explanation}`;
}

function updatePresetNote() {
  const el = document.getElementById('preset-note');
  if (el) el.innerHTML = presetExplanationHtml();
}

function markCustom() {
  if (currentPreset === 'custom') return;
  currentPreset = 'custom';
  const select = document.getElementById('preset-select');
  if (select) select.value = 'custom';
  updatePresetNote();
}

function applyPreset(name) {
  currentPreset = name;
  const preset = PRESETS[name];
  if (name !== 'custom') {
    actFn = preset.actFn;
    setVector(inputs, preset.inputs);
    setMatrix(weights, preset.weights);
    setMatrix(biases, preset.biases);
  }
  buildControls();
  draw();
}

function forwardPass() {
  const acts = [inputs.slice()];
  for (let l = 0; l < weights.length; l++) {
    const layer = [];
    for (let j = 0; j < weights[l].length; j++) {
      let z = biases[l][j];
      for (let i = 0; i < acts[l].length; i++) z += weights[l][j][i] * acts[l][i];
      layer.push(l === weights.length - 1 ? z : activations[actFn](z));
    }
    acts.push(layer);
  }
  return acts;
}

// Shared signed value colour scale.
// This is intentionally the same semantic rule used in the RNN/LSTM pages:
// negative → blue, near zero → dark neutral, positive → orange.
// Nodes are coloured by the exact value displayed inside them.
const valueColor = d3.scaleLinear()
  .domain([-2, 0, 2])
  .range(['#378ADD', '#1e2230', '#e8824a'])
  .clamp(true);

function neuronColor(val) {
  return valueColor(val);
}
function weightColor(w) {
  return valueColor(w);
}
function weightWidth(w) { return 0.5 + Math.abs(w) * 2.5; }

const svg = d3.select('#nn-svg');
const W = 560, H = 300;
svg.attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio', 'xMidYMid meet');
const layerX = [80, W / 2, W - 80];
const R = 22;

function nodeY(li, ni) {
  const n = LAYERS[li];
  const sp = Math.min(90, (H - 60) / (n - 1 + 0.001));
  return (H - sp * (n - 1)) / 2 + ni * sp;
}

const edgeGroup = svg.append('g');
const edgeLabelGroup = svg.append('g');
const nodeGroup = svg.append('g');

function updateNarrative() {
  const acts = forwardPass();
  const el = document.getElementById('narrative');
  const preset = PRESETS[currentPreset];
  const hiddenLines = weights[0].map((toNeuron, j) => {
    const z = biases[0][j] + toNeuron.reduce((s, w, i) => s + w * inputs[i], 0);
    const a = activations[actFn](z);
    const terms = toNeuron.map((w, i) =>
      `<span class="${w>=0?'hi':'lo'}">${w>=0?'+':''}${w.toFixed(2)}·x${i+1}</span>`).join(' ');
    const b = `<span class="${biases[0][j]>=0?'hi':'lo'}">${biases[0][j]>=0?'+':''}${biases[0][j].toFixed(2)}</span>`;
    return `h${j+1}: ${terms} ${b} = <span class="dim">${z.toFixed(3)}</span> → ${actFn} → <span class="${a>=0?'hi':'lo'}">${a.toFixed(3)}</span>`;
  });
  const ha = acts[1], ow = weights[1][0];
  const outZ = biases[1][0] + ow.reduce((s,w,i) => s + w*ha[i], 0);
  const outTerms = ow.map((w,i) => `<span class="${w>=0?'hi':'lo'}">${w>=0?'+':''}${w.toFixed(2)}·h${i+1}</span>`).join(' ');
  const ob = `<span class="${biases[1][0]>=0?'hi':'lo'}">${biases[1][0]>=0?'+':''}${biases[1][0].toFixed(2)}</span>`;
  el.innerHTML =
    `<span class="dim">preset</span> <span class="hi">${preset.label}</span> — ${preset.task}<br><br>` +
    `inputs:  x1 = <span class="hi">${inputs[0].toFixed(2)}</span>,  x2 = <span class="hi">${inputs[1].toFixed(2)}</span><br><br>` +
    `hidden <span class="dim">(${actFn})</span><br>${hiddenLines.join('<br>')}<br><br>` +
    `output<br>out: ${outTerms} ${ob} = <span class="hi">${outZ.toFixed(4)}</span>`;
}

function draw() {
  const acts = forwardPass();
  const edgeData = [];
  for (let l = 0; l < weights.length; l++)
    for (let j = 0; j < weights[l].length; j++)
      for (let i = 0; i < weights[l][j].length; i++)
        edgeData.push({
          x1:layerX[l],
          y1:nodeY(l,i),
          x2:layerX[l+1],
          y2:nodeY(l+1,j),
          w:weights[l][j][i],
          label:l===0?`w${i+1}→${j+1}`:`v${i+1}`,
          key:`${l}-${j}-${i}`
        });

  const lines = edgeGroup.selectAll('line').data(edgeData, d => d.key);
  lines.enter().append('line').attr('stroke-linecap','round').attr('opacity',0.7)
    .merge(lines)
    .attr('x1',d=>d.x1).attr('y1',d=>d.y1).attr('x2',d=>d.x2).attr('y2',d=>d.y2)
    .attr('stroke',d=>weightColor(d.w)).attr('stroke-width',d=>weightWidth(d.w));

  const edgeLabels = edgeLabelGroup.selectAll('text.edge-name').data(edgeData, d => d.key);
  edgeLabels.enter().append('text').attr('class','edge-name')
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('font-family','JetBrains Mono, monospace').attr('font-size',8)
    .merge(edgeLabels)
    .attr('x', d => {
      const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      return (d.x1 + d.x2) / 2 + nx * 10;
    })
    .attr('y', d => {
      const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
      const len = Math.hypot(dx, dy) || 1;
      const ny = dx / len;
      return (d.y1 + d.y2) / 2 + ny * 10;
    })
    .attr('fill', d => weightColor(d.w))
    .attr('opacity', 0.85)
    .text(d => d.label);
  edgeLabels.exit().remove();

  const nodeData = [];
  for (let l = 0; l < LAYERS.length; l++)
    for (let i = 0; i < LAYERS[l]; i++)
      nodeData.push({ l, i, x:layerX[l], y:nodeY(l,i), a:acts[l][i], isOutput:l===LAYERS.length-1, key:`${l}-${i}` });

  const nodes = nodeGroup.selectAll('g.node').data(nodeData, d => d.key);
  const entered = nodes.enter().append('g').attr('class','node');
  entered.append('circle').attr('r',R).attr('stroke-width',1.5);
  entered.append('text').attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('font-family','JetBrains Mono, monospace').attr('font-size',10).attr('fill','rgba(255,255,255,0.75)');

  const merged = entered.merge(nodes);
  merged.attr('transform', d => `translate(${d.x},${d.y})`);
  merged.select('circle')
    .attr('fill', d => neuronColor(d.a))
    .attr('stroke', d => d3.color(neuronColor(d.a)).brighter(0.5));
  merged.select('text').text(d => d.a.toFixed(2));

  const lbls = svg.selectAll('text.layer-label').data([
    {x:layerX[0],label:'input'},{x:layerX[1],label:'hidden'},{x:layerX[2],label:'output'}
  ]);
  lbls.enter().append('text').attr('class','layer-label')
    .attr('text-anchor','middle').attr('font-family','JetBrains Mono, monospace')
    .attr('font-size',10).attr('fill','#565c6e').attr('letter-spacing','0.08em')
    .merge(lbls).attr('x',d=>d.x).attr('y',16).text(d=>d.label);

  d3.select('#output-val').text(acts[acts.length-1][0].toFixed(4));
  updateNarrative();
}

function buildControls() {
  const ctrl = d3.select('#controls');
  ctrl.selectAll('*').remove();

  const MIN_VAL = -2;
  const MAX_VAL = 2;
  const STEP = 0.01;
  const clamp = v => Math.max(MIN_VAL, Math.min(MAX_VAL, v));
  const roundStep = v => Math.round(clamp(v) * 100) / 100;

  function addScalarControl(section, label, value, setValue, options = {}) {
    const { marksCustom = true } = options;
    const row = section.append('div').attr('class','ctrl-row');
    row.append('span').attr('class','ctrl-label').text(label);

    const dec = row.append('button')
      .attr('class','fine-btn')
      .attr('type','button')
      .attr('title',`${label} −0.01`)
      .text('−');

    const sl = row.append('input')
      .attr('type','range')
      .attr('min',MIN_VAL)
      .attr('max',MAX_VAL)
      .attr('step',STEP)
      .attr('value',value);

    const inc = row.append('button')
      .attr('class','fine-btn')
      .attr('type','button')
      .attr('title',`${label} +0.01`)
      .text('+');

    const vl = row.append('span')
      .attr('class','ctrl-val')
      .text(value.toFixed(2));

    const zero = row.append('button')
      .attr('class','zero-btn')
      .attr('type','button')
      .attr('title',`set ${label} to 0`)
      .text('0');

    function apply(next) {
      const v = roundStep(next);
      if (marksCustom) markCustom();
      setValue(v);
      sl.property('value', v);
      vl.text(v.toFixed(2));
      draw();
    }

    sl.on('input', function(){ apply(+this.value); });
    dec.on('click', () => apply(+sl.property('value') - STEP));
    inc.on('click', () => apply(+sl.property('value') + STEP));
    zero.on('click', () => apply(0));
  }

  const presetSec = ctrl.append('div').attr('class','preset-section');
  presetSec.append('div').attr('class','ctrl-section-title').text('presets');
  const presetRow = presetSec.append('div').attr('class','ctrl-row');
  presetRow.append('span').attr('class','ctrl-label').text('task');
  const presetSelect = presetRow.append('select')
    .attr('class','preset-select')
    .attr('id','preset-select');
  Object.entries(PRESETS).forEach(([key, preset]) => {
    presetSelect.append('option').attr('value', key).text(preset.label);
  });
  presetSelect.property('value', currentPreset)
    .on('change', function() { applyPreset(this.value); });
  presetSec.append('div').attr('class','preset-note').attr('id','preset-note');
  updatePresetNote();

  // Reset to zero
  const resetSec = ctrl.append('div').attr('class','reset-section');
  resetSec.append('div').attr('class','ctrl-section-title').text('reset');
  resetSec.append('button')
    .attr('class','reset-btn').attr('id','btn-zero')
    .text('zero all weights')
    .on('click', () => {
      currentPreset = 'custom';
      inputs.fill(0);
      weights.forEach(l => l.forEach(n => n.fill(0)));
      biases.forEach(l => l.fill(0));
      buildControls(); draw();
    });
  resetSec.append('button')
    .attr('class','reset-btn').attr('id','btn-rand-weights')
    .style('margin-top','0.25rem')
    .text('randomise weights')
    .on('click', () => {
      currentPreset = 'custom';
      weights.forEach(l => l.forEach(n => n.forEach((_,i) => n[i] = Math.round((Math.random()*2-1)*100)/100)));
      biases.forEach(l => l.forEach((_,i) => l[i] = Math.round((Math.random()*2-1)*100)/100));
      buildControls(); draw();
    });

  const actSec = ctrl.append('div');
  actSec.append('div').attr('class','ctrl-section-title').text('activation');
  const btnRow = actSec.append('div').attr('class','act-fn-row');
  ['sigmoid','tanh','relu','linear'].forEach(fn => {
    btnRow.append('button')
      .attr('class',`act-btn${actFn===fn?' active':''}`)
      .text(fn)
      .on('click',()=>{ currentPreset='custom'; actFn=fn; buildControls(); draw(); });
  });

  const inSec = ctrl.append('div');
  inSec.append('div').attr('class','ctrl-section-title').text('inputs');
  inputs.forEach((v,i) => {
    addScalarControl(
      inSec,
      `x${i+1}`,
      v,
      next => { inputs[i] = next; },
      { marksCustom: false }
    );
  });

  weights.forEach((layer,l) => {
    const sec = ctrl.append('div').attr('class','weights-section');
    const isOut = l === weights.length - 1;
    sec.append('div').attr('class','ctrl-section-title')
      .text(isOut ? 'output weights  v' : `weights  L${l}→L${l+1}`);
    layer.forEach((toNeuron,j) => {
      toNeuron.forEach((w,i) => {
        addScalarControl(
          sec,
          isOut ? `v${i+1}` : `w${i+1}→${j+1}`,
          w,
          next => { weights[l][j][i] = next; }
        );
      });
    });
  });

  const bSec = ctrl.append('div');
  bSec.append('div').attr('class','ctrl-section-title').text('biases');
  biases.forEach((layer,l) => {
    const isOut = l === biases.length - 1;
    layer.forEach((b,j) => {
      addScalarControl(
        bSec,
        isOut ? 'c' : `b${j+1}`,
        b,
        next => { biases[l][j] = next; }
      );
    });
  });
}
buildControls();
draw();
</script>
</body>
</html>
