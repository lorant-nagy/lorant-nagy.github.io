<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>read on</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d1f0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4em 2em;
    }

    a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      opacity: 0.7;
    }

    .back {
      display: block;
      margin-bottom: 4em;
      font-size: 0.9em;
      text-decoration: none;
      opacity: 0.5;
      letter-spacing: 0.03em;
    }

    .back:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main>
    <a href="/" class="back">← back</a>

    <p>Something here.</p>

  </main>
</body>
</html>
